version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:4.1.2-management
    env_file: .env
    ports:
      - "15672:15672"
      - "5672:5672"

  db:
    image: postgres:17.2
    env_file: .env
    ports:
      - "5432:5432"

  redis:
    image: redis:8.0.3-alpine3.21
    env_file: .env
    ports:
      - "6379:6379"

  s3:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    env_file: .env
    restart: always
    ports:
      - "9000:9000"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    build: caddy
    env_file: .env
    restart: always
    ports:
      - "7432:7432"
    volumes:
      - caddy_data:/data

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    env_file: .env
    ports:
      - "8081:8081"
    volumes:
      - data_telegram:/var/lib/telegram-bot-api

  bot:
    env_file: .env
    build: ./bot
    volumes:
      - ./bot/config/config.toml:/app/config.toml
      - data_telegram:/var/lib/telegram-bot-api
      - uv_cache:/root/.cache/uv
      - ./bot/src:/app/src

  backend:
    env_file: .env
    build: ./backend
    command: uv run faststream run --factory app.main:get_faststream_app --restart
    depends_on:
      - rabbitmq
    restart: always
    volumes:
      - ./backend/config/config.toml:/app/config.toml
      - uv_cache:/root/.cache/uv
      - ./backend/src:/app/src

  formparser:
    container_name: nr_form_parser
    build: ./form_parser
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - rabbitmq
    volumes:
      - uv_cache:/root/.cache


volumes:
  data_telegram:
  uv_cache:
  caddy_data:
