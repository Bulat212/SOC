[project]
name = "app"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "wolf", email = "qrer71@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "aiobotocore<=2.24.2",
    "alembic<=1.16.4",
    "asyncpg>=0.30.0",
    "dishka<=1.6.0",
    "docxtpl>=0.20.1",
    "faststream[cli,rabbit]<=0.5.47",
    "psycopg[binary,pool]<=3.2.10",
    "pydantic<=2.11.7",
    "python-ulid<=3.0.0",
    "sqlalchemy<=2.0.41",
    "types-aiobotocore[essential]<=2.24.2",
    "uvicorn<=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-mock>=3.14.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
