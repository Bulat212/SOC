version: "3.8"

services:
  rabbitmq:
    container_name: nr_broker
    restart: always
    image: rabbitmq:4.1.2
    env_file: .env
    volumes:
      - rabbitmq_data:/data

  s3:
    container_name: nr_s3
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  caddy:
    build: caddy
    env_file: .env
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - caddy_data:/data

  db:
    container_name: nr_db
    image: postgres:17.2
    env_file: .env
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

  telegram-bot-api:
    container_name: nr_telegram_bot_api
    image: aiogram/telegram-bot-api:latest
    env_file: .env
    volumes:
      - data_telegram:/var/lib/telegram-bot-api

  bot:
    container_name: nr_bot
    build: ./bot
    restart: always
    env_file: ".env"
    volumes:
      - ./bot/config/config.toml:/app/config.toml
      - data_telegram:/var/lib/telegram-bot-api
      - uv_cache:/root/.cache/uv

  backend:
    container_name: nr_backend
    build: ./backend
    env_file: ".env"
    depends_on:
      - rabbitmq
    restart: always
    volumes:
      - ./backend/config/config.toml:/app/config.toml
      - uv_cache:/root/.cache/uv

  migration:
    container_name: nr_migration
    build: ./backend
    env_file: ".env"
    depends_on:
      - db
      - backend
    command: uv run alembic upgrade head
    volumes:
      - ./backend/config/config.toml:/app/config.toml
      - uv_cache:/root/.cache/uv

  redis:
    image: redis:8.0.3-alpine3.21
    env_file: .env
    ports:
      - "6379:6379"

volumes:
  rabbitmq_data:
  db:
  minio_data:
  data_telegram:
  uv_cache: